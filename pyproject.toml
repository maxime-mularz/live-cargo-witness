[project]
name = "live-cargo-witness"
version = "0.2.0"
description = "Black-box investigator agent for live animal air cargo — Meta AI Hackathon 2026"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["new/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["new", "new/tests", "new/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # en dashes, arrows and French characters are intentional
  "SIM108",                      # if/else blocks kept when clearer than a ternary
]

[tool.ruff.lint.per-file-ignores]
"new/tests/*" = ["RUF059"]       # tests unpack tuples they only partly use
"new/scripts/*" = ["E402", "I001"]  # scripts import _path first to make lcw importable

[tool.ruff.lint.isort]
known-first-party = ["lcw"]
